<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myGlow.com — Especialistas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Life+Savers:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />

<body>

  <nav class="navbar">
    <a href="index.html" class="navbar__logo">myGlow.com</a>
    <button class="navbar__toggle" aria-label="Abrir menu">☰</button>
    <ul class="navbar__links">
      <li><a href="especialistas.html" class="active">Especialistas</a></li>
      <li><a href="desenvolvedores.html">Desenvolvedores</a></li>
      <li><a href="processo.html">Processo</a></li>
      <li><a href="termos.html">Termos de Uso</a></li>
    </ul>
  </nav>

  <div class="page-panel">
  <main class="page">
    <h1 class="section-title">
      <span class="paper-tag paper-tag--title section-title__line1">
        Equipe de
        <img class="pin pin--tr" src="assets/img/home/pin-tag-verde-home.png" alt="" aria-hidden="true" />
      </span>
      <span class="paper-tag paper-tag--title section-title__line2">
        Especialistas
        <img class="pin pin--bl" src="assets/img/home/pin-tag-rosa-home.png" alt="" aria-hidden="true" />
      </span>
    </h1>

    <div class="specialist-row specialist-row--left">
      <img
        class="specialist-card"
        src="assets/img/team/card-especialista-lucy.png"
        alt="Lucy — Intelectual e elegante, movida pela história, política e resistência Afro-Goth."
      />
      <img class="specialist-sticker" src="assets/img/team/icone-urso-lucy.svg" alt="" aria-hidden="true" />
    </div>

    <div class="specialist-row specialist-row--right">
      <img class="specialist-sticker" src="assets/img/team/Disco%20Animado.svg" alt="" aria-hidden="true" />
      <img
        class="specialist-card"
        src="assets/img/team/card-especialista-cindy.png"
        alt="Cindy — Introspectiva e sensível, encontra na música e na arte New Romantic sua forma de expressão."
      />
    </div>

    <div class="specialist-row specialist-row--left">
      <img
        class="specialist-card"
        src="assets/img/team/card-especialista-sana.png"
        alt="Sana — Uma gyaru vibrante e extrovertida, de atitude feminista e progressista."
      />
      <img class="specialist-sticker" src="assets/img/team/icone-urso-sana.svg" alt="" aria-hidden="true" />
    </div>
  </main>

  <footer class="site-footer">myGlow.com — projeto acadêmico, Apple Developer Academy Fortaleza · <a href="sobre.html">Sobre</a></footer>
  </div>

  <script src="js/main.js"></script>
