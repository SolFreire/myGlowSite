<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myGlow.com — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Life+Savers:wght@700;800&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">myGlow.com</a>
    <button class="navbar__toggle" aria-label="Abrir menu">☰</button>
    <ul class="navbar__links">
      <li><a href="especialistas.html">Especialistas</a></li>
      <li><a href="desenvolvedores.html">Desenvolvedores</a></li>
      <li><a href="processo.html">Processo</a></li>
      <li><a href="sobre.html">Sobre</a></li>
    </ul>
  </nav>

  <div class="page-panel">
  <main class="page home-page">
    <section class="home-hero">
      <img
        class="character-edna"
        src="assets/img/home/personagem-edna-home.png"
        alt="Ilustração da Edna, personagem guia do myGlow"
      />
    </section>

    <img
      class="speech-bubble"
      src="assets/img/home/balao-home.svg"
      alt="Edna: Olá, diva! Meu nome é Edna e sou recepcionista do salão myGlow. Vamos juntas conhecer subculturas e novas maquiagens?"
    />

    <section class="home-bottom">
      <div class="home-cta">
        <h1 class="paper-tags">
          <span class="paper-tag paper-tag--1">Explore uma</span>
          <span class="paper-tag paper-tag--2">nova subcultura</span>
        </h1>

        <a class="store-button" href="#">
          <svg class="store-button__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
          </svg>
          Baixar na loja
        </a>

        <img class="qr-code" src="assets/img/home/qr-code-app-home.png" alt="QR code para baixar o myGlow" />
      </div>

      <div class="home-art">
        <div class="myglow-tag">
          <img class="myglow-tag__img" src="assets/img/home/tag-nome-app-home.png" alt="myGlow" />
          <img class="pin pin--1" src="assets/img/home/pin-tag-verde-home.png" alt="" aria-hidden="true" />
          <img class="pin pin--4" src="assets/img/home/pin-tag-rosa-home.png" alt="" aria-hidden="true" />
          <img class="pin pin--2" src="assets/img/home/pin-tag-azul-home.png" alt="" aria-hidden="true" />
          <img class="pin pin--3" src="assets/img/home/pin-tag-roxo-home.png" alt="" aria-hidden="true" />
        </div>

        <img
          class="trio"
          src="assets/img/home/especialistas-home.png"
          alt="As especialistas Cindy, Sana e Lucy lado a lado"
        />
      </div>
    </section>
  </main>

  </div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <div class="site-footer__top">
        <a href="index.html" class="site-footer__brand">
          <img class="site-footer__icon" src="assets/img/footer/footer-myglow-icon.svg" alt="" aria-hidden="true" />
          <span>
            <span class="site-footer__name">myGlow</span>
            <span class="site-footer__tagline">Explore subculturas</span>
          </span>
        </a>
        <nav class="site-footer__nav" aria-label="Rodapé">
          <a href="especialistas.html">Especialistas</a>
          <a href="desenvolvedores.html">Desenvolvedores</a>
          <a href="processo.html">Processo</a>
          <a href="sobre.html">Sobre</a>
          <a href="sobre.html#contato">Contato</a>
        </nav>
      </div>
      <p class="site-footer__copy">© 2026 myGlow. Conheça uma nova subcultura.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>

</html>
