<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myGlow.com — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&family=Life+Savers:wght@700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__logo">myGlow.com</a>
    <button class="navbar__toggle" aria-label="Abrir menu">☰</button>
    <ul class="navbar__links">
      <li><a href="especialistas.html">Especialistas</a></li>
      <li><a href="desenvolvedores.html">Desenvolvedores</a></li>
      <li><a href="processo.html">Processo</a></li>
      <li><a href="termos.html">Termos de Uso</a></li>
    </ul>
  </nav>

  <div class="page-panel">
  <main class="page home-page">
    <section class="home-hero">
      <img
        class="character-edna"
        src="assets/img/home/personagem-edna-home.png"
        alt="Ilustração da Edna, personagem guia do myGlow"
      />
    </section>

    <div class="speech-bubble">
      <img class="speech-bubble__shape" src="assets/img/home/balao-home.svg" alt="" aria-hidden="true" />
      <p class="speech-bubble__text">Alguma coisa sobre o myGlow</p>
    </div>

    <section class="home-cta">
      <div class="paper-tags">
        <span class="paper-tag paper-tag--1">Leia o qr-code e explore uma</span>
        <span class="paper-tag paper-tag--2">nova subcultura</span>
      </div>

      <div class="myglow-tag">
        <img class="myglow-tag__img" src="assets/img/home/tag-nome-app-home.png" alt="myGlow" />
        <img class="pin pin--1" src="assets/img/home/pin-tag-verde-home.png" alt="" aria-hidden="true" />
        <img class="pin pin--2" src="assets/img/home/pin-tag-azul-home.png" alt="" aria-hidden="true" />
        <img class="pin pin--3" src="assets/img/home/pin-tag-roxo-home.png" alt="" aria-hidden="true" />
      </div>
    </section>

    <section class="home-bottom">
      <img class="qr-code" src="assets/img/home/qr-code-app-home.png" alt="QR code para explorar o myGlow" />

      <div class="trio-group">
        <img class="trio-char trio-char--lucy" src="assets/img/home/personagem-lucy-home.png" alt="Lucy" />
        <img class="trio-char trio-char--sana" src="assets/img/home/personagem-sana-home.png" alt="Sana" />
        <img class="trio-char trio-char--sindy" src="assets/img/home/personagem-sindy-home.png" alt="Sindy" />
      </div>
    </section>
  </main>

  <footer class="site-footer">myGlow.com — projeto acadêmico, Apple Developer Academy Fortaleza · <a href="sobre.html">Sobre</a></footer>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
